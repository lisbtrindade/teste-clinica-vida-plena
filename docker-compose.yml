services:
  mongo:
    image: mongo:8
    container_name: clinica-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: clinica-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/clinica_vida_plena
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: clinica-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
